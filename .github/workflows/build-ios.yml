name: Build iOS App (.ipa)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - 'feature/**'
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web App (Vite)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://inlzvqwfvrxrxwlonhqq.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlubHp2cXdmdnJ4cnh3bG9uaHFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NTI1ODcsImV4cCI6MjEwNjIyODU4N30.KqKj34O7PEiEmUwmGz2yjz9HzhvYzVNTBDM_raM6exY' }}
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios --inline

      - name: Build Xcode Archive (Unsigned)
        run: |
          xcodebuild clean archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_STYLE=Manual

      - name: Package .ipa
        run: |
          mkdir -p "$PWD/build/Payload"
          cp -R "$PWD/build/App.xcarchive/Products/Applications/App.app" "$PWD/build/Payload/"
          cd "$PWD/build"
          zip -r "MoneyDairy-iOS.ipa" Payload
          ls -lh MoneyDairy-iOS.ipa

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyDairy-iOS
          path: build/MoneyDairy-iOS.ipa
          retention-days: 14
