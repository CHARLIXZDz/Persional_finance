name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - 'feature/**'
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App (Vite)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://inlzvqwfvrxrxwlonhqq.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlubHp2cXdmdnJ4cnh3bG9uaHFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NTI1ODcsImV4cCI6MjEwNjIyODU4N30.KqKj34O7PEiEmUwmGz2yjz9HzhvYzVNTBDM_raM6exY' }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyDairy-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
